<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями - Админ-панель</title>

    <!-- Tabler CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>

    <style>
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .action-buttons .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="navigation-container"></div>

    <!-- Page Content -->
    <div class="page-wrapper">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">
                            Администрирование
                        </div>
                        <h2 class="page-title">
                            <i class="ti ti-users me-2"></i>
                            Управление пользователями
                        </h2>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <button class="btn btn-primary" onclick="window.location.reload()">
                                <i class="ti ti-refresh me-1"></i>
                                Обновить
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <!-- Alert Messages -->
                <div id="alertSuccess" class="alert alert-success d-none" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-check icon alert-icon"></i></div>
                        <div><strong>Успешно!</strong> <span id="successMessage"></span></div>
                    </div>
                </div>

                <div id="alertError" class="alert alert-danger d-none" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-alert-circle icon alert-icon"></i></div>
                        <div><strong>Ошибка!</strong> <span id="errorMessage"></span></div>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="row row-cards">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Все пользователи системы</h3>
                                <div class="card-actions">
                                    <span class="badge bg-blue text-white" id="userCount">Загрузка...</span>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-vcenter">
                                        <thead>
                                            <tr>
                                                <th>Пользователь</th>
                                                <th>Email</th>
                                                <th>Компания</th>
                                                <th>Роли</th>
                                                <th>Статус</th>
                                                <th>Последний вход</th>
                                                <th class="w-1">Действия</th>
                                            </tr>
                                        </thead>
                                        <tbody id="usersTableBody">
                                            <tr>
                                                <td colspan="7" class="text-center text-secondary">
                                                    <div class="spinner-border spinner-border-sm me-2"></div>
                                                    Загрузка пользователей...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabler JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
    <script src="/js/navigation.js"></script>

    <script>
        const API_BASE_URL = '/api';
        const accessToken = localStorage.getItem('accessToken');

        // Check if user is logged in
        if (!accessToken) {
            window.location.href = '/login.html';
        }

        // Load users on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
        });

        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE_URL}/admin/users`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) {
                    localStorage.removeItem('accessToken');
                    window.location.href = '/login.html';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to load users');
                }

                const data = await response.json();
                displayUsers(data.users || []);
                document.getElementById('userCount').textContent = `${data.users.length} пользователей`;

            } catch (error) {
                console.error('Error loading users:', error);
                showError('Не удалось загрузить список пользователей');
                document.getElementById('usersTableBody').innerHTML =
                    '<tr><td colspan="7" class="text-center text-danger">Ошибка загрузки данных</td></tr>';
            }
        }

        function displayUsers(users) {
            if (!users || users.length === 0) {
                document.getElementById('usersTableBody').innerHTML =
                    '<tr><td colspan="7" class="text-center text-secondary">Нет пользователей</td></tr>';
                return;
            }

            const html = users.map(user => {
                const fullName = `${user.firstName} ${user.lastName}`;
                const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=206bc4&color=fff`;

                return `
                    <tr>
                        <td>
                            <div class="d-flex align-items-center">
                                <span class="avatar avatar-sm me-2" style="background-image: url(${avatarUrl})"></span>
                                <div>
                                    <div>${fullName}</div>
                                    ${user.phone ? `<div class="text-secondary small">${user.phone}</div>` : ''}
                                </div>
                            </div>
                        </td>
                        <td>${user.email}</td>
                        <td>
                            ${user.company ? `
                                <div>${user.company.name}</div>
                                <div class="text-secondary small">${getCompanyTypeLabel(user.company.type)}</div>
                            ` : '<span class="text-secondary">—</span>'}
                        </td>
                        <td>
                            <div class="d-flex flex-wrap gap-1">
                                ${user.roles.map(role => `
                                    <span class="badge ${getRoleBadgeClass(role)}">${getRoleLabel(role)}</span>
                                `).join('')}
                            </div>
                        </td>
                        <td>
                            ${user.isBlocked
                                ? '<span class="badge bg-danger-lt text-danger">Заблокирован</span>'
                                : '<span class="badge bg-success-lt text-success">Активен</span>'
                            }
                        </td>
                        <td>
                            ${user.lastLoginAt
                                ? `<span class="small">${formatDateTime(user.lastLoginAt)}</span>`
                                : '<span class="text-secondary">—</span>'
                            }
                        </td>
                        <td>
                            <div class="btn-group action-buttons">
                                ${user.isBlocked
                                    ? `<button class="btn btn-success btn-sm" onclick="unblockUser('${user.id}', '${user.email}')" title="Разблокировать">
                                        <i class="ti ti-lock-open"></i>
                                    </button>`
                                    : `<button class="btn btn-warning btn-sm" onclick="blockUser('${user.id}', '${user.email}')" title="Заблокировать">
                                        <i class="ti ti-lock"></i>
                                    </button>`
                                }
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('usersTableBody').innerHTML = html;
        }

        async function blockUser(userId, userEmail) {
            if (!confirm(`Вы уверены, что хотите заблокировать пользователя ${userEmail}?\n\nВсе его активные токены будут аннулированы.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}/block`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to block user');
                }

                showSuccess(`Пользователь ${userEmail} успешно заблокирован`);
                loadUsers();

            } catch (error) {
                console.error('Error blocking user:', error);
                showError(error.message || 'Не удалось заблокировать пользователя');
            }
        }

        async function unblockUser(userId, userEmail) {
            if (!confirm(`Вы уверены, что хотите разблокировать пользователя ${userEmail}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}/unblock`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to unblock user');
                }

                showSuccess(`Пользователь ${userEmail} успешно разблокирован`);
                loadUsers();

            } catch (error) {
                console.error('Error unblocking user:', error);
                showError(error.message || 'Не удалось разблокировать пользователя');
            }
        }

        function getRoleBadgeClass(role) {
            const classes = {
                'ROLE_ADMIN': 'bg-red-lt text-red',
                'ROLE_MANAGER': 'bg-blue-lt text-blue',
                'ROLE_ACCOUNTANT': 'bg-green-lt text-green',
                'ROLE_USER': 'bg-secondary-lt text-secondary'
            };
            return classes[role] || 'bg-secondary-lt text-secondary';
        }

        function getRoleLabel(role) {
            const labels = {
                'ROLE_ADMIN': 'Администратор',
                'ROLE_MANAGER': 'Менеджер',
                'ROLE_ACCOUNTANT': 'Бухгалтер',
                'ROLE_USER': 'Пользователь'
            };
            return labels[role] || role;
        }

        function getCompanyTypeLabel(type) {
            const labels = {
                'factor': 'Факторинговая',
                'supplier': 'Поставщик',
                'debtor': 'Дебитор'
            };
            return labels[type] || type;
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showSuccess(message) {
            const alert = document.getElementById('alertSuccess');
            document.getElementById('successMessage').textContent = message;
            alert.classList.remove('d-none');

            // Hide error if visible
            document.getElementById('alertError').classList.add('d-none');

            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Auto hide after 5 seconds
            setTimeout(() => {
                alert.classList.add('d-none');
            }, 5000);
        }

        function showError(message) {
            const alert = document.getElementById('alertError');
            document.getElementById('errorMessage').textContent = message;
            alert.classList.remove('d-none');

            // Hide success if visible
            document.getElementById('alertSuccess').classList.add('d-none');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
