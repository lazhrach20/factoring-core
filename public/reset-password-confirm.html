<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль - Факторинг Платформа</title>

    <!-- Tabler CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>

    <style>
        .page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f6fa;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #206bc4;
            margin-bottom: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container container-tight py-4">
            <div class="text-center mb-4">
                <div class="logo-text">
                    <i class="ti ti-chart-line"></i> ФинансФактор
                </div>
            </div>

            <div class="card card-md">
                <div class="card-body">
                    <h2 class="h2 text-center mb-4">Установить новый пароль</h2>

                    <!-- Alert Messages -->
                    <div id="alertSuccess" class="alert alert-success d-none" role="alert">
                        <div class="d-flex">
                            <div><i class="ti ti-check icon alert-icon"></i></div>
                            <div><strong>Успешно!</strong> <span id="successMessage"></span></div>
                        </div>
                    </div>

                    <div id="alertError" class="alert alert-danger d-none" role="alert">
                        <div class="d-flex">
                            <div><i class="ti ti-alert-circle icon alert-icon"></i></div>
                            <div><strong>Ошибка!</strong> <span id="errorMessage"></span></div>
                        </div>
                    </div>

                    <!-- Reset Password Form -->
                    <form id="resetPasswordForm" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label">Токен</label>
                            <input
                                type="text"
                                class="form-control"
                                id="token"
                                name="token"
                                placeholder="Введите токен из email"
                                required
                            >
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Новый пароль</label>
                            <div class="input-group input-group-flat">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="newPassword"
                                    name="newPassword"
                                    placeholder="Минимум 8 символов"
                                    required
                                    minlength="8"
                                >
                                <span class="input-group-text">
                                    <a href="#" class="link-secondary" id="togglePassword" title="Показать пароль">
                                        <i class="ti ti-eye"></i>
                                    </a>
                                </span>
                            </div>
                            <div class="invalid-feedback"></div>
                            <small class="form-hint">
                                Пароль должен содержать минимум 8 символов, включая буквы и цифры
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Подтвердите пароль</label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Повторите новый пароль"
                                required
                                minlength="8"
                            >
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary w-100" id="submitButton">
                                <i class="ti ti-lock icon"></i>
                                Установить новый пароль
                            </button>
                        </div>
                    </form>

                    <div class="text-center text-secondary mt-3">
                        <a href="login.html">Вернуться на страницу входа</a>
                    </div>
                </div>
            </div>

            <div class="text-center text-secondary mt-3">
                <small>
                    Не получили письмо? <a href="reset-password.html">Запросить снова</a>
                </small>
            </div>
        </div>
    </div>

    <!-- Tabler JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>

    <script>
        // Get token from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        if (tokenFromUrl) {
            document.getElementById('token').value = tokenFromUrl;
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function(e) {
            e.preventDefault();
            const passwordInput = document.getElementById('newPassword');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('ti-eye');
                icon.classList.add('ti-eye-off');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('ti-eye-off');
                icon.classList.add('ti-eye');
            }
        });

        // Form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Reset validation states
            clearValidation();
            hideAlerts();

            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Client-side validation
            let isValid = true;

            if (!token) {
                showFieldError('token', 'Токен обязателен для заполнения');
                isValid = false;
            }

            if (newPassword.length < 8) {
                showFieldError('newPassword', 'Пароль должен содержать минимум 8 символов');
                isValid = false;
            }

            if (newPassword !== confirmPassword) {
                showFieldError('confirmPassword', 'Пароли не совпадают');
                isValid = false;
            }

            if (!isValid) {
                return;
            }

            const submitButton = document.getElementById('submitButton');
            submitButton.disabled = true;
            submitButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Установка пароля...';

            try {
                const response = await fetch('/api/auth/password/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess(data.message || 'Пароль успешно изменен!');
                    document.getElementById('resetPasswordForm').reset();

                    // Redirect to login page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    if (data.errors) {
                        // Field-level validation errors
                        Object.keys(data.errors).forEach(field => {
                            showFieldError(field, data.errors[field]);
                        });
                    } else {
                        showError(data.error || 'Не удалось изменить пароль. Проверьте токен и попробуйте снова.');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Произошла ошибка при подключении к серверу. Попробуйте позже.');
            } finally {
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="ti ti-lock icon"></i> Установить новый пароль';
            }
        });

        function showSuccess(message) {
            const alert = document.getElementById('alertSuccess');
            document.getElementById('successMessage').textContent = message;
            alert.classList.remove('d-none');

            // Scroll to top to show alert
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showError(message) {
            const alert = document.getElementById('alertError');
            document.getElementById('errorMessage').textContent = message;
            alert.classList.remove('d-none');

            // Scroll to top to show alert
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideAlerts() {
            document.getElementById('alertSuccess').classList.add('d-none');
            document.getElementById('alertError').classList.add('d-none');
        }

        function showFieldError(fieldName, message) {
            const field = document.getElementById(fieldName);
            if (field) {
                field.classList.add('is-invalid');
                const feedback = field.parentElement.querySelector('.invalid-feedback') ||
                                field.nextElementSibling;
                if (feedback && feedback.classList.contains('invalid-feedback')) {
                    feedback.textContent = message;
                    feedback.style.display = 'block';
                }
            }
        }

        function clearValidation() {
            document.querySelectorAll('.is-invalid').forEach(field => {
                field.classList.remove('is-invalid');
            });
            document.querySelectorAll('.invalid-feedback').forEach(feedback => {
                feedback.textContent = '';
                feedback.style.display = 'none';
            });
        }
    </script>
</body>
</html>
