<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Ключи - Факторинг Платформа</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
</head>
<body>
    <!-- Navigation Component -->
    <div id="navigation-container"></div>

    <div class="page-wrapper">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col"><h2 class="page-title"><i class="ti ti-key me-2"></i>API Ключи</h2></div>
                    <div class="col-auto"><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createKeyModal"><i class="ti ti-plus me-1"></i>Создать API ключ</button></div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <div id="alertSuccess" class="alert alert-success d-none"></div>
                <div id="alertError" class="alert alert-danger d-none"></div>

                <div class="card">
                    <div class="card-header"><h3 class="card-title">Ваши API ключи</h3></div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-vcenter">
                                <thead>
                                    <tr><th>Название</th><th>Ключ</th><th>Scopes</th><th>Последнее использование</th><th>Действия</th></tr>
                                </thead>
                                <tbody id="keysTableBody"><tr><td colspan="5" class="text-center"><div class="spinner-border spinner-border-sm me-2"></div>Загрузка...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Key Modal -->
    <div class="modal fade" id="createKeyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Создать API ключ</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label required">Название</label><input type="text" class="form-control" id="keyName" placeholder="1C Integration"></div>
                    <div class="mb-3">
                        <label class="form-label">Права доступа (Scopes)</label>
                        <div><label class="form-check"><input type="checkbox" class="form-check-input" value="accounts:read"><span class="form-check-label">Чтение счетов</span></label></div>
                        <div><label class="form-check"><input type="checkbox" class="form-check-input" value="accounts:write"><span class="form-check-label">Запись счетов</span></label></div>
                        <div><label class="form-check"><input type="checkbox" class="form-check-input" value="transactions:read"><span class="form-check-label">Чтение транзакций</span></label></div>
                        <div><label class="form-check"><input type="checkbox" class="form-check-input" value="transactions:write"><span class="form-check-label">Запись транзакций</span></label></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Лимит запросов в час</label><input type="number" class="form-control" id="rateLimit" value="1000"></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button><button type="button" class="btn btn-primary" onclick="createApiKey()">Создать</button></div>
            </div>
        </div>
    </div>

    <!-- Show Key Modal -->
    <div class="modal fade" id="showKeyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning"><h5 class="modal-title"><i class="ti ti-alert-triangle me-2"></i>Сохраните этот ключ!</h5></div>
                <div class="modal-body">
                    <div class="alert alert-warning mb-3"><strong>Важно!</strong> Этот ключ будет показан только один раз. Сохраните его в безопасном месте.</div>
                    <div class="mb-3"><label class="form-label">Ваш API ключ:</label><div class="input-group"><input type="text" class="form-control font-monospace" id="newApiKey" readonly><button class="btn btn-icon" onclick="copyKey()"><i class="ti ti-copy"></i></button></div></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Понятно</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
    <script src="/js/navigation.js"></script>
    <script>
        const API_BASE_URL = '/api';
        const accessToken = localStorage.getItem('accessToken');
        if (!accessToken) window.location.href = '/login.html';

        document.addEventListener('DOMContentLoaded', () => {
            loadApiKeys();
        });

        async function loadApiKeys() {
            try {
                const resp = await fetch(`${API_BASE_URL}/api-keys`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (resp.status === 401) { localStorage.removeItem('accessToken'); window.location.href = '/login.html'; return; }
                if (resp.status === 403) {
                    showAccessDenied();
                    return;
                }
                const data = await resp.json();
                displayKeys(data.apiKeys || []);
            } catch (e) { showError('Ошибка загрузки ключей'); }
        }

        function showAccessDenied() {
            document.getElementById('keysTableBody').innerHTML = `
                <tr>
                    <td colspan="5" class="text-center">
                        <div class="alert alert-warning mb-0">
                            <h4 class="alert-title"><i class="ti ti-alert-triangle me-2"></i>Доступ ограничен</h4>
                            <div class="text-secondary">
                                <p>API ключи доступны только для:</p>
                                <ul class="text-start" style="display: inline-block;">
                                    <li><strong>Поставщики</strong>: Менеджеры и выше</li>
                                    <li><strong>Дебиторы</strong>: Бухгалтеры и выше</li>
                                    <li><strong>Администраторы</strong>: Для тестирования</li>
                                </ul>
                                <p class="mb-0 mt-2">Обратитесь к администратору вашей компании для получения доступа.</p>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
            // Hide create button
            document.querySelector('.btn-primary[data-bs-target="#createKeyModal"]').style.display = 'none';
        }

        function displayKeys(keys) {
            if (!keys.length) { document.getElementById('keysTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-secondary">Нет API ключей</td></tr>'; return; }
            const html = keys.map(k => `
                <tr>
                    <td><strong>${k.name}</strong><br><small class="text-secondary">${k.id}</small></td>
                    <td><code>${k.maskedKey}</code></td>
                    <td>${k.scopes.map(s => `<span class="badge bg-blue-lt text-blue me-1">${s}</span>`).join('')}</td>
                    <td>${k.lastUsedAt || '<span class="text-secondary">Не использовался</span>'}</td>
                    <td><button class="btn btn-sm ${k.isActive ? 'btn-danger' : 'btn-secondary'}" onclick="revokeKey('${k.id}')" ${!k.isActive ? 'disabled' : ''}>${k.isActive ? 'Отозвать' : 'Отозван'}</button></td>
                </tr>
            `).join('');
            document.getElementById('keysTableBody').innerHTML = html;
        }

        async function createApiKey() {
            const name = document.getElementById('keyName').value;
            if (!name) { alert('Введите название'); return; }
            const scopes = Array.from(document.querySelectorAll('#createKeyModal input[type=checkbox]:checked')).map(cb => cb.value);
            const rateLimit = parseInt(document.getElementById('rateLimit').value) || 1000;

            try {
                const resp = await fetch(`${API_BASE_URL}/api-keys`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, scopes, rateLimit })
                });
                const data = await resp.json();
                if (!resp.ok) { showError(data.error || 'Ошибка создания ключа'); return; }

                document.getElementById('newApiKey').value = data.key;
                bootstrap.Modal.getInstance(document.getElementById('createKeyModal')).hide();
                new bootstrap.Modal(document.getElementById('showKeyModal')).show();

                loadApiKeys();
                document.getElementById('keyName').value = '';
                document.querySelectorAll('#createKeyModal input[type=checkbox]').forEach(cb => cb.checked = false);
            } catch (e) { showError('Ошибка создания ключа'); }
        }

        async function revokeKey(id) {
            if (!confirm('Вы уверены? Это действие нельзя отменить.')) return;
            try {
                const resp = await fetch(`${API_BASE_URL}/api-keys/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (!resp.ok) { showError('Ошибка отзыва ключа'); return; }
                showSuccess('Ключ успешно отозван');
                loadApiKeys();
            } catch (e) { showError('Ошибка отзыва ключа'); }
        }

        function copyKey() {
            const input = document.getElementById('newApiKey');
            input.select();
            document.execCommand('copy');
            alert('Ключ скопирован в буфер обмена');
        }

        function showSuccess(msg) { const el = document.getElementById('alertSuccess'); el.textContent = msg; el.classList.remove('d-none'); setTimeout(() => el.classList.add('d-none'), 5000); }
        function showError(msg) { const el = document.getElementById('alertError'); el.textContent = msg; el.classList.remove('d-none'); }
    </script>
</body>
</html>
